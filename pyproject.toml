[project]
name = "ai-agent"
version = "0.1.0"
description = "Python AI Agent using LangChain and Google Gemini"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Sachin", email = "sachin@example.com"}
]
urls = {LinkedIn = "https://www.linkedin.com/in/sachin-pradhan-ba82a927a"}
dependencies = [
    "langchain",
    "langchain-google-genai",
    "python-dotenv",
    "rich",
    "google-generativeai",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
